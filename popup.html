<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Entry</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --hover-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        p {
            font-size: 0.875rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        button:hover {
            background-color: var(--hover-color);
        }

        button:active {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Lazy Entry</h1>
    <p>就活ES自動入力</p>
    <button id="fillBtn">自動入力実行</button>
    <div class="footer">
        Developed for efficient job hunting
    </div>
    <script src="popup.js"></script>
</body>

</html>
